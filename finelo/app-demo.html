<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finelo · App Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e8e8f2;font:14px system-ui,sans-serif}
main{width:min(100%,410px);height:min(850px,calc(100dvh - 40px));display:flex;flex-direction:column;overflow:hidden;border:8px solid #19182b;border-radius:38px;background:#19182b;box-shadow:0 18px 50px #17172b38}
.status{height:32px;flex:none;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:600}
iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:white}
.indicator{width:100px;height:4px;background:#fff;border-radius:9px;margin:8px auto}
@media(max-width:520px){main{width:100%;height:100dvh;border:0;border-radius:0}.status,.indicator{display:none}}
</style></head>
<body><main aria-label="Finelo phone demo"><div class="status" aria-hidden="true"><span>Finelo</span><span>APP DEMO</span></div><iframe title="Finelo interactive app demo" src="./finelo-home.html"></iframe><div class="indicator" aria-hidden="true"></div></main></body></html>
